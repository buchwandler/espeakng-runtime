[build-system]
requires = [
  "setuptools>=80",
  "setuptools-scm>=9.2",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "espeakng-runtime"
dynamic = ["version"]
description = "Small Python runtime adapter for eSpeak NG phonemization"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "espeakng-runtime contributors"}]
keywords = ["espeak", "espeak-ng", "phonemizer", "ipa", "tts", "g2p"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
bundled = ["espeakng-loader>=0.2.4"]
dev = [
  "build>=1",
  "mypy>=1.10",
  "tomli>=2; python_version < '3.11'",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "twine>=5",
]
docs = [
  "sphinx>=8",
  "myst-parser>=4",
  "sphinx-rtd-theme>=3",
]

[project.urls]
Repository = "https://github.com/buchwandler/espeakng-runtime"
Issues = "https://github.com/buchwandler/espeakng-runtime/issues"
Documentation = "https://github.com/buchwandler/espeakng-runtime#readme"
Changelog = "https://github.com/buchwandler/espeakng-runtime/blob/main/docs/changelog.md"
[tool.setuptools.packages.find]
where = ["."]
include = ["espeakng_runtime*"]

[tool.setuptools.package-data]
espeakng_runtime = ["py.typed"]

[tool.setuptools_scm]
write_to = "espeakng_runtime/_version.py"
fallback_version = "0.1.dev0"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "espeak: requires a working eSpeak/eSpeak NG installation",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
strict_equality = true

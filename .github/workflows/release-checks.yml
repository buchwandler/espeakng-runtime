name: release checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation with warnings as errors
        run: python docs/make.py html
      - name: Check documentation links
        run: python docs/make.py linkcheck

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Check artifacts
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          args=(
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
            --sdist "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          )
          if [ -n "$RELEASE_VERSION" ]; then args+=(--release-version "$RELEASE_VERSION"); fi
          python scripts/check_release_artifacts.py "${args[@]}"
      - name: Install wheel in a clean environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -c 'import espeakng_runtime; print(espeakng_runtime.__version__)'

  bundled:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bundled extra
        run: python -m pip install -e ".[bundled,dev]"
      - name: Run bundled-loader smoke test
        run: python -m pytest -q tests/test_parity.py -k bundled
